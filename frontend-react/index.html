<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!--
      viewport-fit=cover → safe-area insets resolve on notched devices.
      interactive-widget=resizes-content → Android Chrome shrinks the layout
      viewport when the keyboard opens, so dvh-sized areas (chat) make room
      for it instead of hiding the input behind the keyboard. Ignored on
      iOS/desktop, harmless there.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="AI Document Search — upload documents and get cited, RAG-powered answers. Built with FastAPI, LangChain, FAISS and Gemini."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>NeuralDocs — AI Document Search</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
