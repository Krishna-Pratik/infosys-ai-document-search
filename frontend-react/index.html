<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Safari/iOS ignores SVG favicons; rasterized brand mark covers them. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      viewport-fit=cover → safe-area insets resolve on notched devices.
      interactive-widget=resizes-content → Android Chrome shrinks the layout
      viewport when the keyboard opens, so dvh-sized areas (chat) make room
      for it instead of hiding the input behind the keyboard. Ignored on
      iOS/desktop, harmless there.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="NeuralDocs — ask questions of your own documents and get answers that cite the exact passage they came from."
    />
    <meta name="theme-color" content="#07080f" />

    <!--
      Share card (LinkedIn / WhatsApp / X). og:url and og:image must be the
      absolute production URL — relative ones render a bare link on scrapers.
      Update the origin only if the Vercel project slug ever changes.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeuralDocs" />
    <meta property="og:title" content="NeuralDocs — answers that cite your documents" />
    <meta
      property="og:description"
      content="Upload a PDF, then ask. Every answer points back to the exact passage it came from — retrieval grounded in your own files, not the model's guesses."
    />
    <meta property="og:url" content="https://neuraldocs-ai-document-search.vercel.app/" />
    <meta
      property="og:image"
      content="https://neuraldocs-ai-document-search.vercel.app/og.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NeuralDocs — a question answered with a highlighted passage from the source document." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeuralDocs — answers that cite your documents" />
    <meta
      name="twitter:description"
      content="Upload a PDF, then ask. Every answer points back to the exact passage it came from."
    />
    <meta name="twitter:image" content="https://neuraldocs-ai-document-search.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>NeuralDocs — answers that cite your documents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
